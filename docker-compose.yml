name: byte-stop

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  datadog-agent:
    image: datadog/agent:latest
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: datadoghq.com
      DD_HOSTNAME: the-byte-stop-docker # container hostnames aren't reliably resolvable; the Agent's core process refuses to start without an explicit one
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
    ports:
      - "8127:8126" # host 8127 to avoid colliding with the corporate host Agent on 8126
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/bytestop
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - datadog-agent

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
